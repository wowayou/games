<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="wowayou 的独立浏览器游戏收藏：轻松飞行、每日解谜、星球合成、武侠冒险。挑一款，打开就玩。">
  <meta name="theme-color" content="#141613">
  <title>游戏收藏室 · wowayou</title>
  <link rel="stylesheet" href="catalog.css">
</head>
<body>
  <a class="skip-link" href="#collection">跳到游戏列表</a>
  <div class="shell">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>wowayou <span class="brand-label">/ 游戏收藏室</span></span>
      </div>
      <a class="browse-link" href="#collection">挑一款游戏 <span aria-hidden="true">↘</span></a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">SMALL GAMES, DIFFERENT WORLDS.</p>
          <h1 id="page-title">换个世界，<br><em>玩一会儿。</em></h1>
        </div>
        <div class="intro-note">
          <div class="worlds" aria-hidden="true"><span>✳</span><span>↗</span><span>◒</span></div>
          <p>有时想轻松一下，有时想认真闯一关。<br>不同口味的小世界，都在这里。</p>
          <span class="instant"><span aria-hidden="true">●</span> 浏览器即玩，不用下载安装</span>
        </div>
      </section>

      <section id="collection" class="collection" aria-labelledby="collection-title" tabindex="-1">
        <div class="collection-header">
          <h2 id="collection-title">挑选你的下一场冒险<span aria-hidden="true"> ↙</span></h2>
          <p id="catalog-summary">浏览器游戏收藏</p>
        </div>
        <div id="games" class="grid"></div>
        <p id="catalog-status" class="catalog-status" role="status" hidden></p>
        <noscript><p class="catalog-status">请启用 JavaScript 查看游戏列表。</p></noscript>
      </section>
    </main>

    <footer class="site-footer">
      <div><p class="footer-brand">小小的游戏，刚刚好的休息。</p><p>© wowayou · 无追踪 · 游戏记录保存在当前浏览器</p></div>
      <nav id="draft-links" class="draft-links" aria-label="草稿试玩" hidden></nav>
    </footer>
  </div>
  <script type="module" src="catalog.mjs"></script>
</body>
</html>
