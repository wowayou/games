<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="wowayou 的浏览器游戏实验场"><title>ARCADE // 游戏实验场</title><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Noto+Sans+SC:wght@400;700;900&display=swap');*{box-sizing:border-box}body{min-height:100vh;margin:0;color:#f2f7ff;font-family:Orbitron,'Noto Sans SC',sans-serif;background:#070812;background-image:radial-gradient(circle at 12% 15%,#152d6833,transparent 28%),radial-gradient(circle at 88% 78%,#74163238,transparent 29%),repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 5px)}main{max-width:1150px;margin:auto;padding:78px 26px}header{text-align:center;margin-bottom:58px}.eyebrow{color:#28f7ff;letter-spacing:5px;font-size:10px}.eyebrow:before,.eyebrow:after{content:'—';margin:0 13px;color:#ff2aa8}h1{font-size:clamp(42px,8vw,90px);font-style:italic;letter-spacing:-5px;margin:16px 0 9px;text-shadow:3px 2px #ff2aa8,0 0 30px #28f7ff55}header p{font-family:'Noto Sans SC';color:#9eb1c9;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.game{display:flex;flex-direction:column;min-height:380px;position:relative;overflow:hidden;padding:32px;text-decoration:none;color:white;border:1px solid #304877;background:#091021;transition:.25s;isolation:isolate}.game:before{content:'';z-index:-1;position:absolute;inset:0;background:linear-gradient(130deg,#14366388,transparent 55%);opacity:.8}.game.forge:before{background:radial-gradient(circle at 70% 60%,#f9501638,transparent 45%),linear-gradient(130deg,#54150e99,transparent 55%)}.game.survivor:before{background:radial-gradient(circle at 70% 60%,#7c5cff38,transparent 45%),radial-gradient(circle at 30% 30%,#28f7ff22,transparent 50%),linear-gradient(130deg,#0e183099,transparent 55%)}.game:hover{transform:translateY(-8px);border-color:#28f7ff;box-shadow:0 22px 48px #0008}.forge:hover{border-color:#ffd05a}.survivor:hover{border-color:#7c5cff;box-shadow:0 22px 48px #7c5cff22}.badge{font-size:10px;letter-spacing:2px;color:#28f7ff}.forge .badge{color:#ffd05a}.survivor .badge{color:#7c5cff}.game h2{font-size:clamp(26px,3.2vw,42px);font-style:italic;line-height:.86;margin:18px 0 8px;letter-spacing:-2px}.game h2 em{display:block;color:transparent;-webkit-text-stroke:1px #ff2aa8}.forge h2 em{-webkit-text-stroke:1px #ff9b37}.survivor h2 em{-webkit-text-stroke:1px #7c5cff}.cn{font-family:'Noto Sans SC';font-weight:900;color:#ff79bf}.forge .cn{color:#ffbb55}.survivor .cn{color:#a78bff}.desc{font-family:'Noto Sans SC';font-size:13px;line-height:1.75;color:#bdcadb;max-width:330px;margin-top:19px}.tags{margin-top:auto;padding-top:20px;padding-right:34px;display:flex;gap:7px;flex-wrap:wrap}.tags span{padding:5px 8px;font:9px 'Noto Sans SC';border:1px solid #3e6b85;color:#a4e8ff}.forge .tags span{border-color:#8b5130;color:#ffd09b}.survivor .tags span{border-color:#5a3e85;color:#c4a8ff}.arrow{position:absolute;bottom:26px;right:28px;font-size:28px;color:#28f7ff}.forge .arrow{color:#ffd05a}.survivor .arrow{color:#7c5cff}footer{text-align:center;margin-top:45px;color:#536078;font:11px 'Noto Sans SC'}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){main{padding:48px 16px}.grid{grid-template-columns:1fr}.game{min-height:320px}}footer a{color:#66728a;text-decoration:none}.catalog-status{text-align:center;color:#9eb1c9;font:14px 'Noto Sans SC';margin:32px 0}</style></head><body><main><header>
  <div class="eyebrow">WOWAYOU WEB LABS</div>
  <h1>GAME ARCADE</h1>
  <p id="catalog-summary">浏览器游戏 · 音效与数据均在本地运行</p>
</header>
<section id="games" class="grid" aria-label="游戏列表"></section>
<p id="catalog-status" class="catalog-status" role="status">正在加载游戏…</p>
<noscript><p class="catalog-status">请启用 JavaScript 查看游戏列表。</p></noscript>
<footer>© wowayou · 无追踪 · 无后端 · 你的记录只在浏览器本地<span id="draft-links"></span></footer>
</main>
<script type="module" src="catalog.mjs"></script>
</body></html>
