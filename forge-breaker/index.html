<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>HELL FORGE · 地狱熔炉</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><canvas id="game"></canvas><div id="vignette"></div><header><div class="brand"><i>⚒</i><div>HELL <b>FORGE</b><small>深渊锻造所</small></div></div><div class="stats"><span>第 <b id="wave">1</b> 炉</span><span>连击 <b id="combo">0</b></span><span>矿石 <b id="ore">0</b></span><span>金库 <b id="vault">0</b></span><button id="sound">♫</button></div></header><aside class="left"><div class="vital"><label>炉心完整度</label><div class="bar hp"><i id="hpbar"></i></div><strong id="hp">100 / 100</strong></div><div class="vital"><label>熔炉热度 ×<b id="heatx">1.0</b></label><div class="bar heat"><i id="heatbar"></i></div></div><div class="balls" id="ballList"></div></aside><aside class="right"><div class="relic"><label>下一波</label><b id="next">钢铁守卫</b><small id="waveInfo">摧毁所有敌人</small></div><div class="relic"><label>控制</label><small>A / D 或 ← / → 移动<br>鼠标瞄准 · 点击 / 空格发射<br>F 存入金库（死亡不丢失）</small></div></aside><div id="aim"></div><div id="toast"></div><section id="menu" class="screen active"><div class="title"><div class="anvil">⚒</div><p>THE INFERNAL WORKSHOP</p><h1>HELL<br><em>FORGE</em></h1><h2>地狱熔炉</h2><p class="desc">将炼狱球打入深渊。锻造、融合、冒险，<br>在怪物抵达炉心前烧尽它们。</p><button class="primary" id="start">点燃炉火 <b>ENTER</b></button><div class="tips"><span>元素球叠加状态</span><span>满级球可融合</span><span>矿石可永久锻造</span></div></div></section><section id="draft" class="screen"><div class="modal"><p>熔炉共鸣 · 选择一项锻造</p><h2>选择强化</h2><div class="cards" id="cards"></div></div></section><section id="forge" class="screen"><div class="modal forge"><p>带着矿石归来</p><h2>永恒锻炉</h2><div id="forgeCards" class="cards"></div><button id="continue" class="primary">深入下一炉 <b>ENTER</b></button></div></section><section id="gameover" class="screen"><div class="modal"><p id="overEyelash">熔炉熄灭</p><h2 id="overTitle">深渊吞没了一切</h2><div class="result"><span>最高炉次 <b id="overWave">1</b></span><span>本局矿石 <b id="overOre">0</b></span><span>最佳炉次 <b id="overBest">1</b></span></div><button id="restart" class="primary">重新点燃 <b>R</b></button></div></section><div id="touch"><button data-k="KeyA">‹</button><button data-k="Space" class="fire">⚒</button><button data-k="KeyD">›</button></div></div><script src="game.js"></script></body></html>
